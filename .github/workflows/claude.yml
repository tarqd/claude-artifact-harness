name: Claude

# Summon Claude by writing "@claude ..." in an issue, an issue comment, a PR
# review comment, or a review body. Claude picks up the surrounding thread as
# context, and pushes a branch when the ask is a code change.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per thread; a second mention supersedes an in-flight one.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Cheap pre-filter so unrelated comments never start a runner. The action
    # checks the trigger phrase again itself.
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # push a branch when the ask is a code change
      pull-requests: write   # open PRs, comment
      issues: write          # comment on issues
      id-token: write        # OIDC for the Anthropic API
      actions: read          # read CI logs when asked why a run failed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: anthropics/claude-code-action@v1
        with:
          # Swap for `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}`
          # to bill a Claude Pro/Max subscription instead of an API key.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(npm ci),Bash(npm run build),Bash(npm test:*),Bash(npm run e2e:*)"
